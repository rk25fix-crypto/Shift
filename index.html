<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保育園シフト自動作成 - 完全カスタム＆アラート版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- ApexCharts.js -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <!-- 印刷特化の魔法（CSS） -->
    <style>
        /* 読み込み時のチラつき防止 */
        [x-cloak] { display: none !important; }

        @media print {
            @page { size: landscape; margin: 10mm; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { font-size: 11pt; color: #000; background: #fff; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            select {
                appearance: none !important;
                -webkit-appearance: none !important;
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                color: #000 !important;
                font-weight: bold;
                text-align: center;
            }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #666 !important; padding: 4px 2px !important; }
            .bg-indigo-100 { background-color: #e0e7ff !important; }
            .bg-red-50 { background-color: #fef2f2 !important; }
            .bg-slate-200 { background-color: #e2e8f0 !important; }
        }
        .print-only { display: none; }
        
        /* 矢印を消して重なり防止 */
        select.shift-select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: none !important;
            padding-right: 2px !important;
            text-align-last: center;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased" x-data="shiftApp()" x-init="init()">

    <!-- Header (no-print) -->
    <header class="bg-indigo-600 text-white shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                保育園早出シフトメーカー <span class="bg-indigo-500 px-2 py-0.5 rounded text-xs">期間・枠指定 ＆ 警告アラート搭載版</span>
            </h1>
            <div class="text-sm bg-indigo-700 px-3 py-1 rounded-full hidden sm:block">
                スタッフ数: <span x-text="staffs.length"></span>名 | 早出枠: <span x-text="shiftTypes.length"></span>種類
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">

        <!-- Tabs (no-print) -->
        <div class="flex border-b border-slate-200 gap-4 overflow-x-auto no-print">
            <button @click="tab = 'staff'" :class="tab === 'staff' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'" class="pb-3 px-2 font-medium border-b-2 transition whitespace-nowrap">1. スタッフ管理</button>
            <button @click="tab = 'settings'" :class="tab === 'settings' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'" class="pb-3 px-2 font-medium border-b-2 transition whitespace-nowrap">2. 条件・時間設定</button>
            <button @click="tab = 'generate'" :class="tab === 'generate' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'" class="pb-3 px-2 font-medium border-b-2 transition whitespace-nowrap">3. AI自動生成 ＆ 印刷</button>
            <button @click="tab = 'charts'; setTimeout(() => renderChart(), 50)" :class="tab === 'charts' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'" class="pb-3 px-2 font-medium border-b-2 transition whitespace-nowrap">4. 負荷グラフ</button>
            <button @click="tab = 'data'" :class="tab === 'data' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'" class="pb-3 px-2 font-medium border-b-2 transition whitespace-nowrap">5. データ保存</button>
        </div>

        <!-- TAB 1: Staff -->
        <div x-show="tab === 'staff'" class="space-y-6 no-print">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                <h2 class="text-lg font-bold">スタッフ一覧</h2>
                <button @click="addStaff()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">＋ 追加</button>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider">
                            <th class="p-4">名前</th>
                            <th class="p-4 hidden sm:table-cell">担当業務</th>
                            <th class="p-4 text-center">早出対応</th>
                            <th class="p-4 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200 text-sm">
                        <template x-for="(staff, index) in staffs" :key="staff.id">
                            <tr class="hover:bg-slate-50">
                                <td class="p-4"><input type="text" x-model="staff.name" class="border rounded px-2 py-1 w-full max-w-xs focus:ring-2 focus:ring-indigo-500 outline-none" @change="renderChart()"></td>
                                <td class="p-4 hidden sm:table-cell">
                                    <select x-model="staff.role" class="border rounded px-2 py-1 bg-white">
                                        <option value="乳児担当">乳児担当</option>
                                        <option value="幼児担当">幼児担当</option>
                                        <option value="フリー">フリー</option>
                                        <option value="主任">主任</option>
                                    </select>
                                </td>
                                <td class="p-4 text-center"><input type="checkbox" x-model="staff.canEarly" class="w-4 h-4 text-indigo-600 rounded"></td>
                                <td class="p-4 text-center"><button @click="removeStaff(index)" class="text-red-500 hover:text-red-700 text-xs font-medium">削除</button></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: Settings & Offs -->
        <div x-show="tab === 'settings'" class="space-y-6 no-print">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 期間指定 -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <label class="block text-sm font-bold text-slate-700 mb-2">シフト対象期間（連休対応）</label>
                    <div class="flex items-center gap-2">
                        <input type="date" x-model="startDate" class="border rounded-lg px-3 py-2 w-full bg-slate-50" @change="updatePeriodDays()">
                        <span class="font-bold text-slate-500">〜</span>
                        <input type="date" x-model="endDate" class="border rounded-lg px-3 py-2 w-full bg-slate-50" @change="updatePeriodDays()">
                    </div>
                    <p class="text-xs text-slate-500 mt-2">※期間を変更するとカレンダーが自動生成されます</p>
                </div>

                <!-- 早出の種類 -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-sm font-bold">早出の種類と所要時間（分）</h2>
                        <button @click="addShiftType()" class="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded hover:bg-indigo-200 font-bold">＋ 種類を追加</button>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-40 overflow-y-auto pr-2">
                        <template x-for="(type, index) in shiftTypes" :key="type.id">
                            <div class="flex items-center gap-1 border border-slate-200 p-1.5 rounded bg-slate-50">
                                <input type="text" x-model="type.name" class="w-16 text-xs border rounded px-1 py-1 text-center font-bold">
                                <input type="number" x-model.number="type.time" class="w-12 text-xs border rounded px-1 py-1 text-center" min="10" step="10">
                                <button @click="removeShiftType(index)" class="text-slate-400 hover:text-red-500 ml-1">×</button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- カレンダー（希望休） -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
                <div class="flex justify-between items-end mb-2">
                    <h2 class="text-lg font-bold">希望休マトリクス</h2>
                    <span class="text-xs text-red-500 font-bold">※クリックで「休」</span>
                </div>
                <table class="w-full text-center text-xs border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600">
                            <!-- 列幅を広げる（名前が潰れないように） -->
                            <th class="p-2 text-left sticky left-0 bg-slate-100 z-10 border-r min-w-[120px] whitespace-nowrap shadow-[1px_0_0_#e2e8f0]">スタッフ</th>
                            <template x-for="day in periodDays" :key="day.key">
                                <th class="p-1 border-r min-w-[35px]" :class="{'text-red-500': day.isSun, 'text-blue-500': day.isSat}">
                                    <div x-text="day.displayDate"></div>
                                    <div x-text="day.weekday" class="text-[10px]"></div>
                                </th>
                            </template>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                        <template x-for="staff in staffs" :key="staff.id">
                            <tr class="hover:bg-slate-50">
                                <!-- 列幅を広げる -->
                                <td class="p-2 text-left font-medium sticky left-0 bg-white z-10 border-r min-w-[120px] whitespace-nowrap shadow-[1px_0_0_#e2e8f0]" x-text="staff.name"></td>
                                <template x-for="day in periodDays" :key="day.key">
                                    <td class="p-1 border-r cursor-pointer" @click="toggleOff(staff.id, day.key)" :class="isOff(staff.id, day.key) ? 'bg-red-100 text-red-700 font-bold' : 'hover:bg-slate-100'">
                                        <span x-text="isOff(staff.id, day.key) ? '休' : ''"></span>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 3: Generate & Print Result -->
        <div x-show="tab === 'generate'" class="space-y-6">
            <div class="print-only text-center mb-4">
                <h1 class="text-2xl font-bold" x-text="`${startDate.replace(/-/g, '/')} 〜 ${endDate.replace(/-/g, '/')} 早出シフト表`"></h1>
            </div>

            <!-- ★ ヌケモレ警告バナー -->
            <div x-cloak x-show="getMissingShiftsReport().length > 0" class="bg-red-50 border-l-4 border-red-500 p-4 rounded-xl shadow-sm no-print mb-6">
                <div class="flex items-center">
                    <svg class="w-6 h-6 text-red-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <h3 class="text-red-800 font-bold">手動調整アラート：割り当てられていない早出枠があります！</h3>
                </div>
                <ul class="mt-2 ml-8 text-sm text-red-700 list-disc">
                    <template x-for="report in getMissingShiftsReport()" :key="report.date">
                        <li>
                            <span x-text="report.displayDate" class="font-bold"></span> : 
                            <span class="font-medium bg-red-100 px-1 rounded" x-text="report.missing.join(', ')"></span> が未割り当てです。
                        </li>
                    </template>
                </ul>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4 no-print">
                <h2 class="text-lg font-bold">シフト自動生成 ＆ 印刷</h2>
                <div class="flex gap-3">
                    <button @click="generateShiftWithSimulation()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition shadow-sm">最適化して自動生成</button>
                    <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
                        印刷する
                    </button>
                </div>
            </div>

            <div class="bg-white p-2 sm:p-6 rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
                <table class="w-full text-center text-xs border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600">
                            <th class="p-2 text-left sticky left-0 bg-slate-100 z-10 border-r min-w-[120px] whitespace-nowrap shadow-[1px_0_0_#e2e8f0]">スタッフ</th>
                            <template x-for="day in periodDays" :key="day.key">
                                <!-- ★ ヘッダーに相対配置(relative)を追加し、警告アイコンを配置 -->
                                <th class="p-1 border-r min-w-[40px] relative" :class="{'text-red-500': day.isSun, 'text-blue-500': day.isSat}">
                                    <div x-text="day.displayDate" class="font-bold"></div>
                                    <div x-text="day.weekday" class="text-[9px]"></div>
                                    <!-- ★ 警告アイコン (早出が足りていない日だけ点滅表示) -->
                                    <div x-cloak x-show="isDayMissingShifts(day.key)" class="absolute top-0 right-0 text-red-500 text-[10px] animate-pulse no-print" title="早出が不足">⚠️</div>
                                </th>
                            </template>
                            <th class="p-2 bg-slate-200 sticky right-0 z-10">時間合計</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                        <template x-for="staff in staffs" :key="staff.id">
                            <tr class="hover:bg-slate-50">
                                <td class="p-2 text-left font-medium sticky left-0 bg-white z-10 border-r min-w-[120px] whitespace-nowrap shadow-[1px_0_0_#e2e8f0]" x-text="staff.name"></td>
                                <template x-for="day in periodDays" :key="day.key">
                                    <td class="p-0 border-r" :class="{'bg-red-50/30': day.isSun, 'bg-blue-50/30': day.isSat}">
                                        <select x-model="shifts[staff.id][day.key]" @change="renderChart()" class="shift-select text-xs py-1 rounded border-0 bg-transparent text-center w-full font-semibold"
                                            :class="{
                                                'bg-red-50 text-red-600': shifts[staff.id][day.key] === '休',
                                                'text-slate-300': shifts[staff.id][day.key] === '-',
                                                'bg-indigo-100 text-indigo-800': shifts[staff.id][day.key] !== '-' && shifts[staff.id][day.key] !== '休'
                                            }">
                                            <option value="-">-</option>
                                            <option value="休">休</option>
                                            <template x-for="type in shiftTypes" :key="type.id">
                                                <option :value="type.name" x-text="type.name"></option>
                                            </template>
                                        </select>
                                    </td>
                                </template>
                                <td class="p-2 bg-slate-100 font-bold sticky right-0 z-10 text-[10px] whitespace-nowrap text-indigo-700" x-text="calcTotalTime(staff.id) + '分'"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 4: Charts -->
        <div x-show="tab === 'charts'" class="space-y-6 no-print">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-2">スタッフ別 負荷グラフ（合計時間）</h2>
                <div id="shiftChart" class="min-h-[500px]"></div>
            </div>
        </div>

        <!-- TAB 5: Data Management -->
        <div x-show="tab === 'data'" class="space-y-6 no-print">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold mb-2">💾 ブラウザにセーブ（一時保存）</h2>
                    <div class="flex gap-3">
                        <button @click="saveToBrowser()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">セーブする</button>
                        <button @click="loadFromBrowser()" class="border border-indigo-600 text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-lg text-sm font-medium transition">ロードする</button>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold mb-2">📄 ファイル保存（バックアップ）</h2>
                    <div class="flex flex-col gap-3">
                        <button @click="exportDataFile()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium transition w-max">バックアップをダウンロード</button>
                        <label class="border border-slate-300 hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer w-max">
                            ファイルから読み込む
                            <input type="file" accept=".json" class="hidden" @change="importDataFile($event)">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function shiftApp() {
            return {
                tab: 'generate',
                startDate: '2026-08-08',
                endDate: '2026-08-16',
                periodDays: [],
                
                shiftTypes: [
                    { id: 1, name: '早1', time: 30 }, { id: 2, name: '早2', time: 60 },
                    { id: 3, name: '早3', time: 45 }, { id: 4, name: '早4', time: 90 },
                    { id: 5, name: '早5', time: 30 }, { id: 6, name: '早6', time: 60 }
                ],
                
                staffs: Array.from({length: 20}, (_, i) => ({
                    id: i + 1, name: `スタッフ ${i + 1}`, role: 'フリー', canEarly: true
                })),
                requestOffs: {}, 
                shifts: {},      
                chart: null,     

                init() {
                    this.staffs[11].canEarly = false;
                    this.updatePeriodDays();
                },

                updatePeriodDays() {
                    if (!this.startDate || !this.endDate) return;
                    let start = new Date(this.startDate);
                    let end = new Date(this.endDate);
                    if (end < start) return; 

                    const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
                    let newDays = [];
                    let current = new Date(start);

                    while (current <= end) {
                        let yyyy = current.getFullYear();
                        let mm = String(current.getMonth() + 1).padStart(2, '0');
                        let dd = String(current.getDate()).padStart(2, '0');
                        let dateKey = `${yyyy}-${mm}-${dd}`; 
                        
                        let wdIndex = current.getDay();
                        newDays.push({ 
                            key: dateKey, 
                            displayDate: `${current.getMonth() + 1}/${current.getDate()}`, 
                            weekday: weekdays[wdIndex], 
                            isSat: wdIndex === 6, 
                            isSun: wdIndex === 0 
                        });
                        current.setDate(current.getDate() + 1);
                    }
                    this.periodDays = newDays;
                    this.initShifts();
                },

                addShiftType() {
                    const newId = this.shiftTypes.length > 0 ? Math.max(...this.shiftTypes.map(t => t.id)) + 1 : 1;
                    this.shiftTypes.push({ id: newId, name: `早${newId}`, time: 30 });
                },
                removeShiftType(index) {
                    this.shiftTypes.splice(index, 1);
                },

                addStaff() {
                    const newId = this.staffs.length > 0 ? Math.max(...this.staffs.map(s => s.id)) + 1 : 1;
                    this.staffs.push({ id: newId, name: `スタッフ ${newId}`, role: 'フリー', canEarly: true });
                    this.initShifts();
                },
                removeStaff(index) {
                    this.staffs.splice(index, 1);
                    this.initShifts();
                },

                toggleOff(staffId, dayKey) {
                    const key = `${staffId}_${dayKey}`;
                    this.requestOffs[key] ? delete this.requestOffs[key] : this.requestOffs[key] = true;
                },
                isOff(staffId, dayKey) { return !!this.requestOffs[`${staffId}_${dayKey}`]; },

                initShifts() {
                    let newShifts = {};
                    this.staffs.forEach(s => {
                        newShifts[s.id] = {};
                        this.periodDays.forEach(day => {
                            if(this.shifts[s.id] && this.shifts[s.id][day.key]){
                                newShifts[s.id][day.key] = this.shifts[s.id][day.key];
                            } else {
                                newShifts[s.id][day.key] = this.isOff(s.id, day.key) ? '休' : '-';
                            }
                        });
                    });
                    this.shifts = newShifts;
                    setTimeout(() => { this.renderChart() }, 50);
                },

                calcTotalTime(staffId) {
                    if (!this.shifts[staffId]) return 0;
                    let total = 0;
                    this.periodDays.forEach(day => {
                        let sName = this.shifts[staffId][day.key];
                        let typeObj = this.shiftTypes.find(t => t.name === sName);
                        if (typeObj) total += typeObj.time;
                    });
                    return total;
                },

                // ==========================================
                // ★ ヌケモレ判定関数（バナー表示用）
                // ==========================================
                getMissingShiftsReport() {
                    let report = [];
                    if (!this.shiftTypes || this.shiftTypes.length === 0) return report;
                    
                    const requiredTypes = this.shiftTypes.map(t => t.name);

                    this.periodDays.forEach(day => {
                        let assignedTypes = new Set();
                        this.staffs.forEach(staff => {
                            let s = this.shifts[staff.id] && this.shifts[staff.id][day.key];
                            if (s && s !== '-' && s !== '休') {
                                assignedTypes.add(s);
                            }
                        });
                        
                        let missing = requiredTypes.filter(t => !assignedTypes.has(t));
                        if (missing.length > 0) {
                            report.push({
                                date: day.key,
                                displayDate: day.displayDate,
                                missing: missing
                            });
                        }
                    });
                    return report;
                },

                // ==========================================
                // ★ 特定の日付のヌケモレ判定（ヘッダーの⚠️アイコン用）
                // ==========================================
                isDayMissingShifts(dayKey) {
                    if (!this.shiftTypes || this.shiftTypes.length === 0) return false;
                    let assignedTypes = new Set();
                    
                    this.staffs.forEach(staff => {
                        let s = this.shifts[staff.id] && this.shifts[staff.id][dayKey];
                        if (s && s !== '-' && s !== '休') assignedTypes.add(s);
                    });
                    
                    const requiredTypes = this.shiftTypes.map(t => t.name);
                    return requiredTypes.some(t => !assignedTypes.has(t));
                },

                generateShiftWithSimulation() {
                    const SIMULATION_COUNT = 100; 
                    let bestShifts = null;
                    let bestScore = Infinity;
                    let shortageDays = [];
                    
                    const requiredCount = this.shiftTypes.length;

                    if(requiredCount === 0) {
                        alert("早出の種類が設定されていません。");
                        return;
                    }

                    for (let attempt = 0; attempt < SIMULATION_COUNT; attempt++) {
                        let tempShifts = JSON.parse(JSON.stringify(this.shifts)); 
                        let tempTotalTime = {}; 

                        this.staffs.forEach(s => {
                            tempTotalTime[s.id] = 0;
                            this.periodDays.forEach(day => {
                                if(this.isOff(s.id, day.key)) tempShifts[s.id][day.key] = '休';
                                else tempShifts[s.id][day.key] = '-';
                            });
                        });

                        let isPossible = true;
                        let currentShortage = [];

                        this.periodDays.forEach(day => {
                            let dKey = day.key;
                            let candidates = this.staffs.filter(s => s.canEarly && !this.isOff(s.id, dKey));
                            
                            if (candidates.length < requiredCount) {
                                isPossible = false;
                                currentShortage.push(day.displayDate);
                                return; 
                            }

                            // シャッフルして割り当て
                            let typesToAssign = [...this.shiftTypes].sort(() => Math.random() - 0.5);
                            let availableStaff = [...candidates];
                            
                            for (let typeObj of typesToAssign) {
                                availableStaff.sort((a, b) => {
                                    return (tempTotalTime[a.id] - tempTotalTime[b.id]) + (Math.random() * 40 - 20); 
                                });
                                let chosen = availableStaff.shift(); 
                                tempShifts[chosen.id][dKey] = typeObj.name;
                                tempTotalTime[chosen.id] += typeObj.time;
                            }
                        });

                        if (!isPossible) {
                            shortageDays = currentShortage;
                            break; 
                        }

                        let times = Object.keys(tempTotalTime).filter(id => this.staffs.find(s=>s.id==id).canEarly).map(id => tempTotalTime[id]);
                        let score = Math.max(...times) - Math.min(...times); 

                        if (score < bestScore) {
                            bestScore = score;
                            bestShifts = JSON.parse(JSON.stringify(tempShifts));
                        }
                    }

                    if (shortageDays.length > 0) alert(`🚨【警告】${shortageDays.join(', ')} は人が足りません！`);
                    else if (bestShifts) this.shifts = bestShifts;
                    
                    setTimeout(() => { this.renderChart() }, 50);
                },

                countSpecificEarly(staffId, typeName) {
                    if (!this.shifts[staffId]) return 0;
                    return Object.values(this.shifts[staffId]).filter(v => v === typeName).length;
                },

                renderChart() {
                    if (this.tab !== 'charts' && !this.chart) return; 
                    const sortedStaffs = [...this.staffs].sort((a, b) => this.calcTotalTime(b.id) - this.calcTotalTime(a.id));
                    
                    const seriesData = this.shiftTypes.map(typeObj => ({
                        name: typeObj.name + ` (${typeObj.time}分)`,
                        data: sortedStaffs.map(s => this.countSpecificEarly(s.id, typeObj.name) * typeObj.time)
                    }));
                    
                    const options = {
                        series: seriesData,
                        chart: { type: 'bar', height: 500, stacked: true, fontFamily: 'inherit', toolbar: { show: false } },
                        plotOptions: { bar: { horizontal: true } },
                        stroke: { width: 1, colors: ['#fff'] },
                        xaxis: { categories: sortedStaffs.map(s => s.name), labels: { style: { colors: '#64748b' }, formatter: (val) => val + "分" } },
                        yaxis: { labels: { style: { colors: '#64748b' } } },
                        fill: { opacity: 1 },
                        legend: { position: 'top', horizontalAlign: 'left', offsetX: 40 }
                    };
                    if (this.chart) this.chart.updateOptions(options);
                    else {
                        const chartEl = document.querySelector("#shiftChart");
                        if (chartEl) { this.chart = new ApexCharts(chartEl, options); this.chart.render(); }
                    }
                },

                getDumpData() {
                    return {
                        startDate: this.startDate, endDate: this.endDate,
                        shiftTypes: this.shiftTypes, staffs: this.staffs,
                        requestOffs: this.requestOffs, shifts: this.shifts
                    };
                },
                applyDumpData(data) {
                    this.startDate = data.startDate || this.startDate;
                    this.endDate = data.endDate || this.endDate;
                    this.shiftTypes = data.shiftTypes || this.shiftTypes;
                    this.staffs = data.staffs || this.staffs;
                    this.requestOffs = data.requestOffs || this.requestOffs;
                    this.shifts = data.shifts || this.shifts;
                    this.updatePeriodDays();
                },
                saveToBrowser() {
                    localStorage.setItem('hoikuenShiftBackup_v2', JSON.stringify(this.getDumpData()));
                    alert('ブラウザにセーブしました。');
                },
                loadFromBrowser() {
                    const json = localStorage.getItem('hoikuenShiftBackup_v2');
                    if(!json) return alert('セーブデータが見つかりません。');
                    if(confirm('ロードしますか？（現在の入力は消えます）')) {
                        this.applyDumpData(JSON.parse(json));
                        alert('復元完了！');
                    }
                },
                exportDataFile() {
                    const blob = new Blob([JSON.stringify(this.getDumpData(), null, 2)], {type: 'application/json'});
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `shift_backup_${this.startDate}.json`;
                    link.click();
                },
                importDataFile(e) {
                    const file = e.target.files[0];
                    if(!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            if(confirm('読み込みますか？（上書きされます）')) {
                                this.applyDumpData(JSON.parse(event.target.result));
                                alert('読み込み完了！');
                            }
                        } catch(err) { alert('ファイルエラーです。'); }
                        e.target.value = ''; 
                    };
                    reader.readAsText(file);
                }
            }
        }
    </script>
</body>
</html>
