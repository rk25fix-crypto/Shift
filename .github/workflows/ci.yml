name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Tenant-isolation suite (lib/db/scopedClient.isolation.d1.test.ts):
      # runs against a real Miniflare-backed D1 instance, not mocks — the
      # practical stand-in for Postgres RLS now that D1 has no equivalent
      # (docs/plan.md, "テナント分離モデル(D1版)"). Must stay green on
      # every PR.
      - run: npm run test:d1
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # webServer runs `npm run dev` = `vinext dev`, a real local Cloudflare
    # Workers dev server (Miniflare). With no stored `wrangler login` state
    # and no token, some of its startup paths reach for the real Cloudflare
    # API before falling back to local-only behavior. A placeholder token
    # short-circuits that (D1 here is always local/file-backed — no calls
    # are actually made with it), and disabling telemetry skips the
    # first-run metrics opt-in path. Neither needs to be a real credential.
    env:
      CLOUDFLARE_API_TOKEN: ci-local-dev-placeholder-not-a-real-token
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
